name: waifu2x-ncnn-vulkan
url: https://github.com/nihui/waifu2x-ncnn-vulkan
license: MIT
pkgdesc: "Image super-resolution and noise reduction using waifu2x, with Vulkan acceleration"
docs:
  externalAur:
    - waifu2x-ncnn-vulkan-git
variants:
  bin:
    pkgver: 20250915
    depends: [vulkan-icd-loader]
    versionChecker: "curl -s https://api.github.com/repos/nihui/waifu2x-ncnn-vulkan/releases/latest | jq -r '.tag_name' | cat"
    source:
      - "waifu2x-ncnn-vulkan-${pkgver}.zip::${url}/releases/download/${pkgver}/waifu2x-ncnn-vulkan-${pkgver}-linux.zip"
    package: |
      cd "waifu2x-ncnn-vulkan-${pkgver}-linux"
      install -Dm755 waifu2x-ncnn-vulkan "${pkgdir}/usr/bin/waifu2x-ncnn-vulkan"
      install -dm755 "${pkgdir}/usr/share/waifu2x-ncnn-vulkan"
      cp -r models-* "${pkgdir}/usr/share/waifu2x-ncnn-vulkan/"
