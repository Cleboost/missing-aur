name: mochi-recorder
docs:
url: https://github.com/4ndreello/mochi-recorder
license: MIT
pkgdesc: "A modern Linux screen recorder with smooth animations like Screen Studio"

variants:
  appimage:
    pkgver: 1.0.22
    pkgrel: 3
    depends: [fuse2]
    options: ["!strip"]
    versionChecker: "curl -s https://api.github.com/repos/4ndreello/mochi-recorder/releases/latest | jq -r '.tag_name' | sed 's/^v//'"
    source:
      - "mochi-recorder-appimage-${pkgver}.AppImage::${url}/releases/download/v${pkgver}/Mochi-${pkgver}.AppImage"
      - "mochi-recorder.png::https://raw.githubusercontent.com/4ndreello/mochi-recorder/main/src/renderer/assets/icon.png"
      - "mochi-recorder.desktop::https://raw.githubusercontent.com/Cleboost/missing-aur/main/packages/mochi-recorder/mochi-recorder.desktop"
    prepare: |
      chmod +x "${srcdir}/mochi-recorder-appimage-${pkgver}.AppImage"
    package: |
      install -Dm755 "${srcdir}/mochi-recorder-appimage-${pkgver}.AppImage" "${pkgdir}/opt/mochi-recorder-appimage/mochi.AppImage"
      install -dm755 "${pkgdir}/usr/bin"
      ln -sf "/opt/mochi-recorder-appimage/mochi.AppImage" "${pkgdir}/usr/bin/mochi"
      install -Dm644 "${srcdir}/mochi-recorder.png" "${pkgdir}/usr/share/icons/hicolor/512x512/apps/mochi-recorder.png"
      install -Dm644 "${srcdir}/mochi-recorder.desktop" "${pkgdir}/usr/share/applications/mochi-recorder.desktop"
