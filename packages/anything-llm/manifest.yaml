name: anything-llm
docs:
  externalAur: []
url: https://github.com/Mintplex-Labs/anything-llm
license: MIT
pkgdesc: "All-in-one AI desktop app: local or cloud LLMs, RAG and AI agents over your documents"
variants:
  appimage:
    pkgver: "0"
    versionChecker: "curl -s https://api.github.com/repos/Mintplex-Labs/anything-llm/releases/latest | jq -r '.tag_name' | sed 's/^v//'"
    source:
      - "anything-llm-${pkgver}.AppImage::${url}/releases/download/v${pkgver}/AnythingLLMDesktop.AppImage"
    package: |
      install -Dm755 "anything-llm-${pkgver}.AppImage" "${pkgdir}/usr/bin/anything-llm"
