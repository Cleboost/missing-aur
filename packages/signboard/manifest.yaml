name: signboard
docs:
url: https://github.com/cdevroe/signboard
license: MIT
arch: [x86_64, aarch64]
pkgdesc: "A local-first kanban app that writes Markdown files"

variants:
  appimage:
    pkgver: 1.6.0
    depends: [fuse2]
    options: ["!strip"]
    versionChecker: "curl -s https://api.github.com/repos/cdevroe/signboard/releases/latest | jq -r '.tag_name' | sed 's/^v//'"
    source:
      x86_64:
        - "signboard-appimage-${pkgver}-x86_64.AppImage::${url}/releases/download/${pkgver}/signboard_${pkgver}_linux_x86_64.AppImage"
        - "signboard.png::https://raw.githubusercontent.com/cdevroe/signboard/main/build/icons/512x512.png"
        - "signboard.desktop::https://raw.githubusercontent.com/Cleboost/missing-aur/main/packages/signboard/signboard.desktop"
      aarch64:
        - "signboard-appimage-${pkgver}-aarch64.AppImage::${url}/releases/download/${pkgver}/signboard_${pkgver}_linux_arm64.AppImage"
        - "signboard.png::https://raw.githubusercontent.com/cdevroe/signboard/main/build/icons/512x512.png"
        - "signboard.desktop::https://raw.githubusercontent.com/Cleboost/missing-aur/main/packages/signboard/signboard.desktop"
    prepare: |
      if [ "${CARCH}" = "x86_64" ]; then
        chmod +x "${srcdir}/signboard-appimage-${pkgver}-x86_64.AppImage"
      elif [ "${CARCH}" = "aarch64" ]; then
        chmod +x "${srcdir}/signboard-appimage-${pkgver}-aarch64.AppImage"
      fi
    package: |
      if [ "${CARCH}" = "x86_64" ]; then
        install -Dm755 "${srcdir}/signboard-appimage-${pkgver}-x86_64.AppImage" "${pkgdir}/opt/signboard-appimage/signboard.AppImage"
      elif [ "${CARCH}" = "aarch64" ]; then
        install -Dm755 "${srcdir}/signboard-appimage-${pkgver}-aarch64.AppImage" "${pkgdir}/opt/signboard-appimage/signboard.AppImage"
      fi
      install -dm755 "${pkgdir}/usr/bin"
      ln -sf "/opt/signboard-appimage/signboard.AppImage" "${pkgdir}/usr/bin/signboard"
      install -Dm644 "${srcdir}/signboard.png" "${pkgdir}/usr/share/icons/hicolor/512x512/apps/signboard.png"
      install -Dm644 "${srcdir}/signboard.desktop" "${pkgdir}/usr/share/applications/signboard.desktop"
