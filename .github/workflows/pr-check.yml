name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  package-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.packages.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags "https://github.com/${{ github.repository }}.git" "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Detect changed packages
        id: packages
        run: |
          apps=$(python3 scripts/pr_packages.py --base "origin/${{ github.base_ref }}")
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Changed packages: ${apps:-<none>}"

      - name: Run PR checks
        id: check
        if: always() && steps.packages.outputs.apps != ''
        continue-on-error: true
        run: |
          python3 scripts/pr_check.py \
            --base "origin/${{ github.base_ref }}" \
            --apps ${{ steps.packages.outputs.apps }} \
            --output pr-report.md

      - name: Save PR number
        if: always() && steps.packages.outputs.apps != ''
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload check recap artifact
        if: always() && steps.packages.outputs.apps != ''
        uses: actions/upload-artifact@v4
        with:
          name: pr-recap
          path: |
            pr-report.md
            pr-number.txt
          if-no-files-found: ignore

      - name: Fail on remaining issues
        if: steps.packages.outputs.apps != '' && steps.check.outcome == 'failure'
        run: exit 1

  build-test:
    needs: package-check
    if: needs.package-check.outputs.apps != ''
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git base-devel python-yaml sudo

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Setup build user
        run: |
          useradd -m build
          echo "build ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/build
          chown -R build:build "$GITHUB_WORKSPACE"
          sudo -u build git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and install changed packages
        run: |
          for app in ${{ needs.package-check.outputs.apps }}; do
            echo "::group::Building $app"
            sudo -u build python3 scripts/manage.py generate "packages/$app"
            for pkgdir in packages/"$app"/*/; do
              if [ -f "${pkgdir}PKGBUILD" ]; then
                (cd "$pkgdir" && sudo -u build makepkg -si --noconfirm)
              fi
            done
            echo "::endgroup::"
          done
