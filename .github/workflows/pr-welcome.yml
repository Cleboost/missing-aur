name: PR Welcome

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Detect changed packages
        id: packages
        run: |
          apps=$(python3 scripts/pr_packages.py --base "origin/${{ github.base_ref }}")
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Changed packages: ${apps:-<none>}"

      - name: Post welcome message
        if: steps.packages.outputs.apps != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-welcome
          message: |
            Hi! Thanks for opening this PR and contributing to **missing-aur**.

            I'll run the package checks shortly and post a recap comment when I'm done.
            If anything needs a tweak, I may also push small fix commits to your branch.

            Hang tight — I'll be back in a moment.
